name: Manejo de contextos
on: [push, pull_request]

jobs:
  validar-y-firmar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar Estructura del Mensaje
        if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'feature:') && !startsWith(github.event.head_commit.message, 'fix:')
        run: |
          echo "::error::Estructura de commit inválida."
          exit 1

      - name: Validar Versión Única
        shell: python
        run: |
          import sys
          import subprocess
          import os

          if not os.path.exists('VERSION'):
              sys.exit(1)

          with open('VERSION', 'r') as f:
              new_v = f.read().strip()

          try:
              existing_tags = subprocess.check_output(['git', 'tag']).decode('utf-8').split()
          except:
              existing_tags = []
          
          if new_v in existing_tags:
              print(f"::error::La versión {new_v} ya existe.")
              sys.exit(1)

          try:
              old_v = subprocess.check_output(['git', 'show', 'HEAD~1:VERSION']).decode('utf-8').strip()
              if new_v == old_v:
                  print(f"::error::La versión no ha cambiado.")
                  sys.exit(1)
          except:
              pass

      - name: Finalizar con Firma
        if: success()
        run: |
          echo "---------------------------------------"
          echo "PROCESO COMPLETADO EXITOSAMENTE"
          echo "CREATED BY: ${{ github.actor }}"
          echo "EVENTO: ${{ github.event_name }}"
          echo "---------------------------------------"
